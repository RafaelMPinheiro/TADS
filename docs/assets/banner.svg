<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Portfólio acadêmico TADS</title>
  <desc id="d">Banner ilustrativo com o título Portfólio acadêmico TADS, o subtítulo IFRS Campus Rio Grande e quatro blocos de semestre de 2024-1 a 2025-2.</desc>
  <rect width="1200" height="300" fill="#0F2A43"/>
  <rect x="0" y="288" width="1200" height="12" fill="#2BB3A3"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
