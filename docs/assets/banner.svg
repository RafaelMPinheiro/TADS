    <text x="64" y="186" font-size="72" font-weight="700" fill="#FFFFFF">Portfólio TADS</text>
    <text x="64" y="236" font-size="28" fill="#D6E4F0">Análise e Desenvolvimento de Sistemas</text>
  </g>
  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">
