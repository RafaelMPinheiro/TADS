<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Organização do repositório por semestre e disciplina</title>
  <desc id="d">Diagrama da estrutura de pastas: do repositório TADS partem quatro pastas de semestre em sequência, 2024-1, 2024-2, 2025-1 e 2025-2, cada uma com suas disciplinas. 2024-1: Estrutura de dados, PPP, PBD e WEB1. 2024-2: WEB-II e tads-webii-2024-2. 2025-1: Redes e PPA. 2025-2: CC, apps, sistemas e tbd.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F2A43"/></marker>
  </defs>
  <rect width="960" height="470" fill="#FFFFFF"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="34" font-size="22" font-weight="700" fill="#0F2A43">Pastas AAAA-S, uma por semestre, com disciplinas dentro</text>
    <g font-size="22" font-weight="700">
      <rect x="20" y="60" width="205" height="56" rx="10" fill="#0F2A43"/><text x="122" y="95" fill="#FFFFFF">2024-1</text>
      <rect x="265" y="60" width="205" height="56" rx="10" fill="#0F2A43"/><text x="367" y="95" fill="#FFFFFF">2024-2</text>
      <rect x="510" y="60" width="205" height="56" rx="10" fill="#0F2A43"/><text x="612" y="95" fill="#FFFFFF">2025-1</text>
      <rect x="755" y="60" width="185" height="56" rx="10" fill="#0F2A43"/><text x="847" y="95" fill="#FFFFFF">2025-2</text>
    </g>
    <g stroke="#0F2A43" stroke-width="3" marker-end="url(#a)">
      <line x1="225" y1="88" x2="261" y2="88"/><line x1="470" y1="88" x2="506" y2="88"/><line x1="715" y1="88" x2="751" y2="88"/>
    </g>
    <g stroke="#9DB4C8" stroke-width="2">
      <line x1="122" y1="116" x2="122" y2="140"/><line x1="367" y1="116" x2="367" y2="140"/><line x1="612" y1="116" x2="612" y2="140"/><line x1="847" y1="116" x2="847" y2="140"/>
    </g>
    <g font-size="18" font-weight="600" fill="#0F2A43" stroke="#2BB3A3" stroke-width="2">
      <g fill="#E8F6F4">
        <rect x="20" y="140" width="205" height="52" rx="8"/><rect x="20" y="204" width="205" height="52" rx="8"/><rect x="20" y="268" width="205" height="52" rx="8"/><rect x="20" y="332" width="205" height="52" rx="8"/>
        <rect x="265" y="140" width="205" height="52" rx="8"/><rect x="265" y="204" width="205" height="52" rx="8"/>
        <rect x="510" y="140" width="205" height="52" rx="8"/><rect x="510" y="204" width="205" height="52" rx="8"/>
        <rect x="755" y="140" width="185" height="52" rx="8"/><rect x="755" y="204" width="185" height="52" rx="8"/><rect x="755" y="268" width="185" height="52" rx="8"/><rect x="755" y="332" width="185" height="52" rx="8"/>
      </g>
    </g>
    <g font-size="18" font-weight="700" fill="#0F2A43">
      <text x="122" y="173">Estrutura de dados</text><text x="122" y="237">PPP</text><text x="122" y="301">PBD</text><text x="122" y="365">WEB1</text>
      <text x="367" y="173">WEB-II</text><text x="367" y="237">tads-webii-2024-2</text>
      <text x="612" y="173">Redes</text><text x="612" y="237">PPA</text>
      <text x="847" y="173">CC</text><text x="847" y="237">apps</text><text x="847" y="301">sistemas</text><text x="847" y="365">tbd</text>
    </g>
    <text x="480" y="428" font-size="17" fill="#33495C">Dentro de cada disciplina: aulas, exercícios, listas e trabalhos, com código e materiais de apoio.</text>
    <text x="480" y="453" font-size="15" fill="#33495C">Ilustração do autor, não é captura de tela.</text>
  </g>
</svg>
